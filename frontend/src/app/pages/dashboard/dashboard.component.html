<app-navbar></app-navbar>

<div class="dashboard-body flex flex-row">
    <app-sidebar></app-sidebar>
    
    <div class="content-area flex-1 p-6 ml-45">
        
        <div class="notificaciones-area p-8 shadow-lg/20 inset-shadow-xs min-w-64 rounded-xl">

            @for(Aviso of AvisosList; track Aviso.Servidor){

           
            <div class="card-notificacion shadow-lg rounded-lg border-2 border-solid border-[#E50000] ">

                <div class="titulo-Card">{{Aviso.Servidor}}</div>
           

            <div class="body-card">
                <p> <strong>Estado Actual:</strong>{{Aviso.Estado_Actual}} </p>
                <p> <strong>Problema:</strong> {{Aviso.Tipo_Alerta}} </p>
                <p> <strong>Fecha:</strong> {{Aviso.Fecha}} </p>
            </div>

            <div class="btns">
                <button class="btn-Reconocida bg-[#6896D9] p-1 text-white rounded-lg " (click)="Alerta_Reconocida(Aviso.Tipo_Alerta, Aviso.Servidor)">Reconocida</button>
                <button class="btn-Resuelta bg-[#37A836] p-1 text-white rounded-lg" (click)="Alerta_Resuelta(Aviso)">Alerta Resuelta</button>
            </div>

            
 </div>
  }
        </div>

    </div>
</div>
